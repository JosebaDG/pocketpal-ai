name: Coach Workspace Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/coach/**'
      - 'src/services/talents/CoachWorkspaceEngine.ts'
      - 'src/services/talents/coachFileAccess.ts'
      - 'src/services/talents/SwimAgentEngine.ts'
      - 'src/services/talents/__tests__/CoachWorkspaceEngine.test.ts'
      - 'src/services/talents/__tests__/SwimAgentEngine.test.ts'
      - 'scripts/**'
      - '.github/workflows/coach-workspace-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: TypeScript type check
        run: yarn typecheck
      - name: Coach roster tests
        run: yarn test --runInBand --runTestsByPath src/features/coach/__tests__/CoachRoster.test.ts src/features/coach/__tests__/CoachRosterStateless.test.ts
      - name: Coach Talent tests
        run: yarn test --runInBand --runTestsByPath src/services/talents/__tests__/SwimAgentEngine.test.ts src/services/talents/__tests__/CoachWorkspaceEngine.test.ts
